name: BSE PDF Analyzer Bot

on:
  schedule:
    # માર્કેટના સમય દરમિયાન દર 2 કલાકે રન થશે (સોમ-શુક્ર)
    - cron: '30 4-10/2 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi PyPDF2 google-generativeai fake-useragent

      - name: Run BSE PDF Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bse_pdf_bot.py
